<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Ultimi reel creati — TipsMotivazionale</title>
<style>
:root{--oro:#d4a72c;--fondo:#0b0b0b;--carta:#151515;--bordo:#262626;
      --testo:#e8e6e1;--tenue:#9a968e;--sale:#7bbf6a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fondo);color:var(--testo);
     font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     padding:1.6rem 1.1rem 3rem;-webkit-text-size-adjust:100%}
main{max-width:34rem;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
.testata{display:flex;flex-direction:column;gap:.15rem;margin-bottom:.4rem}
.marchio{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
         color:var(--tenue);font-weight:700}
.marchio span{color:var(--oro)}
.aggiornato{font-size:.8rem;color:var(--tenue)}
.totale{font-size:2.6rem;line-height:1.05;font-weight:800;letter-spacing:-.02em;
        font-variant-numeric:tabular-nums}
.totale small{display:block;font-size:.82rem;font-weight:500;color:var(--tenue);
              letter-spacing:0;margin-top:.2rem}
.carta{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;
       padding:1rem 1.05rem;display:flex;flex-direction:column;gap:.55rem}
.nome{font-size:1.02rem;font-weight:700;line-height:1.25}
.quando{font-size:.82rem;color:var(--tenue)}
.stato{font-size:.9rem;display:flex;align-items:center;gap:.45rem}
.pallino{width:.5rem;height:.5rem;border-radius:50%;background:var(--tenue);
         flex:none}
.sale .pallino{background:var(--sale)}
.sale{color:var(--sale)}
.grosso{font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;
        letter-spacing:-.02em}
.grosso small{font-size:.8rem;font-weight:500;color:var(--tenue);
              letter-spacing:0;margin-left:.35rem}
.dettagli{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;
          border-top:1px solid var(--bordo);padding-top:.7rem}
.dettagli div{display:flex;flex-direction:column;gap:.1rem}
.dettagli b{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.dettagli span{font-size:.68rem;color:var(--tenue);text-transform:uppercase;
               letter-spacing:.05em}
.follower{background:var(--carta);border:1px solid var(--bordo);
          border-left:3px solid var(--oro);border-radius:12px;padding:.9rem 1rem;
          font-size:.92rem;white-space:pre-line}
.vuoto{color:var(--tenue);text-align:center;padding:2.5rem 0}

.reel{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;
  padding:.9rem;display:flex;flex-direction:column;gap:.6rem}
.reel .nome{font-size:.92rem;color:var(--tenue);word-break:break-all}
.nuovo{background:var(--oro);color:#0b0b0b;font-size:.7rem;font-weight:800;
  padding:.12rem .4rem;border-radius:5px;letter-spacing:.03em}
video{width:100%;border-radius:10px;display:block;background:#000}
</style></head><body><main>
<header class="testata">
  <p class="marchio">TIPS<span>MOTIVAZIONALE</span></p>
  <p class="nome" style="font-size:1.3rem">Reel pronti da guardare</p>
  <p class="quando">12/09 alle 21:30 · 4 in coda, di cui
     1 appena creati ·
     nessuno ancora pubblicato</p>
</header>
<section class="reel"><p class="nome"><span class="nuovo">NUOVO</span> 95-sinatra-8000-dollari-per-tornare</p><video controls preload="metadata" src="video/95-sinatra-8000-dollari-per-tornare.mp4"></video></section>
<section class="reel"><p class="nome">100-giacomo-puccini-fischiata-alla-scala</p><video controls preload="metadata" src="video/100-giacomo-puccini-fischiata-alla-scala.mp4"></video></section>
<section class="reel"><p class="nome">96-brando-il-provino-che-non-doveva-fare</p><video controls preload="metadata" src="video/96-brando-il-provino-che-non-doveva-fare.mp4"></video></section>
<section class="reel"><p class="nome">97-freud-la-protesi-che-chiamava-il-mostro</p><video controls preload="metadata" src="video/97-freud-la-protesi-che-chiamava-il-mostro.mp4"></video></section>
</main></body></html>
